[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weft-memory"
version = "0.1.0a0"
description = "Evidence-bound scoped memory substrate for people and their agents"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [
  {name = "Johann Ross", email = "johann@ousiaresearch.xyz"},
]
keywords = ["memory", "scope", "retrieval", "agent", "sqlite", "embeddings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Logging",
]
dependencies = [
  "sqlite-vec>=0.1.9,<0.2",
  "pypdf>=6.21.2,<7",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
local-embedding = [
  "mlx>=0.32.4,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-embeddings==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
local-recall = [
  "sentence-transformers>=2.0",
  "torch>=2.0",
]
server = [
  "fastapi>=0.111",
  "uvicorn>=0.29",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/ousiaresearch/weft"
Repository = "https://github.com/ousiaresearch/weft"
Issues = "https://github.com/ousiaresearch/weft/issues"

[project.scripts]
weft = "weft.cli:entrypoint"

[tool.setuptools]
packages = ["weft"]
